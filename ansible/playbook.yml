---
# =============================================================================
# Playbook: provisiona TODO o ambiente do Projeto Korp (Partes 1 e 2).
# Executa: instalação do Docker, criação da rede, build da imagem,
# subida dos containers (app + nginx + prometheus + grafana), configuração
# do proxy reverso/monitoramento e validação do serviço via HTTP.
#
# Uso:  ansible-playbook playbook.yml
# =============================================================================
- name: Provisionar ambiente do Projeto Korp
  hosts: korp
  become: true

  vars:
    deploy_dir: /opt/projeto-korp
    docker_network: korp-net
    # Diretório do projeto (um nível acima da pasta ansible/).
    project_src: "{{ playbook_dir }}/.."
    # Itens do projeto que serão copiados para o servidor.
    project_items:
      - app
      - nginx
      - prometheus
      - grafana
      - docker-compose.yml

  tasks:
    # -------------------------------------------------------------------------
    # 1. INSTALAÇÃO DO DOCKER (repositório oficial)
    # -------------------------------------------------------------------------
    - name: Instalar pacotes de pré-requisito
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: true

    - name: Criar diretório de keyrings do APT
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Baixar a chave GPG oficial do Docker
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Adicionar o repositório do Docker
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ ansible_architecture | replace('x86_64','amd64') | replace('aarch64','arm64') }}
          signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
        filename: docker
        state: present

    - name: Instalar Docker Engine, CLI e o plugin do Compose
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Garantir que o serviço do Docker está ativo e habilitado
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    # -------------------------------------------------------------------------
    # 2. ENVIO DOS ARQUIVOS DO PROJETO PARA O SERVIDOR
    # -------------------------------------------------------------------------
    - name: Criar o diretório de deploy
      ansible.builtin.file:
        path: "{{ deploy_dir }}"
        state: directory
        mode: "0755"

    - name: Copiar os arquivos do projeto para o servidor
      ansible.builtin.copy:
        src: "{{ project_src }}/{{ item }}"
        dest: "{{ deploy_dir }}/"
        mode: preserve
      loop: "{{ project_items }}"

    # -------------------------------------------------------------------------
    # 3. CRIAÇÃO DA REDE DOCKER (modo bridge)
    # -------------------------------------------------------------------------
    - name: Verificar se a rede Docker já existe
      ansible.builtin.command: "docker network inspect {{ docker_network }}"
      register: rede_check
      changed_when: false
      failed_when: false

    - name: Criar a rede Docker bridge
      ansible.builtin.command: "docker network create --driver bridge {{ docker_network }}"
      when: rede_check.rc != 0

    # -------------------------------------------------------------------------
    # 4. BUILD DA IMAGEM E SUBIDA DOS CONTAINERS (docker compose)
    # -------------------------------------------------------------------------
    - name: Build da imagem e subida dos containers com docker compose
      # Sem "--build": o compose só constrói a imagem quando ela ainda não
      # existe (o serviço tem a chave "build:"). Isso torna a task idempotente.
      ansible.builtin.command:
        cmd: docker compose up -d
        chdir: "{{ deploy_dir }}"
      register: compose_up
      # O docker compose escreve o progresso no stderr. Em estado estável ele
      # imprime apenas "Running"/"Waiting"/"Healthy"; quando algo realmente muda
      # aparecem "Created", "Recreated", "Started", "Building", etc. Reportamos
      # "changed" só nesse último caso — assim re-execuções sem mudança ficam OK.
      changed_when: >-
        (compose_up.stdout ~ compose_up.stderr)
        is search('(?i)(Creat|Recreat|Start|Building|Remov|Stopp|Kill|Pull)')

    # -------------------------------------------------------------------------
    # 5. VALIDAÇÃO DO SERVIÇO VIA HTTP (através do NGINX na porta 80)
    # -------------------------------------------------------------------------
    - name: Aguardar o serviço responder através do proxy reverso
      ansible.builtin.uri:
        url: http://localhost:80/projeto-korp
        method: GET
        return_content: true
      register: resposta
      until: resposta.status == 200
      retries: 30
      delay: 2

    - name: Exibir a resposta do serviço no console
      ansible.builtin.debug:
        msg:
          - "Status HTTP: {{ resposta.status }}"
          - "Resposta JSON: {{ resposta.json }}"

    - name: Resumo dos acessos
      ansible.builtin.debug:
        msg:
          - "Serviço:    curl http://localhost:80/projeto-korp"
          - "Métricas:   http://localhost:9090 (Prometheus)"
          - "Dashboards: http://localhost:3000 (Grafana - admin/admin)"
