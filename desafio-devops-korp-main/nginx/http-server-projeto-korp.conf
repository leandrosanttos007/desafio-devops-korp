server {
    listen 80;
    server_name localhost;

    # Resolver DNS embutido do Docker (127.0.0.11). Combinado com a variável
    # $upstream abaixo, faz o NGINX RE-RESOLVER o hostname do app a cada
    # requisição (respeitando valid=10s), em vez de fixar o IP só na
    # inicialização. Assim, se o container do app for recriado e mudar de IP,
    # o proxy continua funcionando sem precisar reiniciar o NGINX.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Liveness do próprio NGINX (não faz proxy) — usado pelo healthcheck do compose.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        # "http-server-projeto-korp" é o nome do serviço no docker-compose.
        # Usar uma variável força a resolução dinâmica via resolver acima.
        set $upstream http-server-projeto-korp:8080;
        proxy_pass http://$upstream;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
