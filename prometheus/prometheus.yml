global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Coleta as métricas expostas pelo próprio serviço em /metrics.
  # A métrica "up" gerada por esse job representa a DISPONIBILIDADE do serviço.
  - job_name: "http-server-projeto-korp"
    metrics_path: /metrics
    static_configs:
      - targets: ["http-server-projeto-korp:8080"]

  # Coleta as métricas do próprio Prometheus (útil para diagnóstico).
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
